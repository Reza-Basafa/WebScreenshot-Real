name: Capture Website Screenshot

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس وب‌سایت مورد نظر'
        required: true
        type: string
        default: 'https://example.com'
      full_page:
        description: 'اسکرین‌شات تمام صفحه؟'
        required: false
        type: boolean
        default: true
      width:
        description: 'عرض صفحه (px)'
        required: false
        type: number
        default: 1280
      height:
        description: 'ارتفاع صفحه (px)'
        required: false
        type: number
        default: 800

jobs:
  screenshot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: |
          npm install puppeteer
          npx puppeteer browsers install chrome

      - name: Take screenshot with Puppeteer
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          
          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            
            await page.setViewport({
              width: ${{ github.event.inputs.width }},
              height: ${{ github.event.inputs.height }}
            });
            
            await page.goto('${{ github.event.inputs.url }}', {
              waitUntil: 'networkidle2',
              timeout: 60000
            });
            
            const fullPage = ${{ github.event.inputs.full_page }};
            await page.screenshot({ 
              path: 'screenshot.png',
              fullPage: fullPage
            });
            
            await browser.close();
            console.log('Screenshot saved as screenshot.png');
          })().catch(err => {
            console.error('Error:', err);
            process.exit(1);
          });
          "

      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ github.run_id }}
          path: screenshot.png
          retention-days: 30
